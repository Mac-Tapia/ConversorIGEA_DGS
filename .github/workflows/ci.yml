# Spec 102 (RF-12 a RF-15): en cada subida y petición de fusión, la suite sintética y el frontend.
# Aquí no hay datos de la distribuidora ni pueden subirse: sus pruebas se omiten, y la suite completa sin omitidas la
# exige el gancho pre-push en la máquina que los tiene (102:RF-5 a RF-9).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Suite sintética (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Como en el equipo de desarrollo (102:RF-17): un .venv, porque el lanzador y sus pruebas corren dentro de uno
      # (pyvenv.cfg); el extra «ml» (torch de CPU aquí: no hay GPU), y las herramientas del frontend que usan dos
      # pruebas del backend (openapi-typescript, el lint de entrega). El 2026-11-10, sin ellos, 71 pruebas fallaban
      # solo en GitHub.
      - name: Dependencias
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip setuptools wheel
          .venv\Scripts\python -m pip install -r requirements.txt
          .venv\Scripts\python -m pip install -e ".[ml]"
      # 048 T3b: Ipopt oficial de COIN-OR, el mismo que en desarrollo, comprobado por su SHA-256 antes de usarlo.
      - name: Ipopt 3.14.20
        run: |
          $zip = "$env:RUNNER_TEMP\ipopt.zip"
          Invoke-WebRequest -Uri 'https://github.com/coin-or/Ipopt/releases/download/releases%2F3.14.20/Ipopt-3.14.20-win64-msvs2022-md.zip' -OutFile $zip
          $huella = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($huella -ne '1fd1de97d3e8e48c298f6ccf5ac91cbfc417b42c61262c08d193fd14117e9098') { throw "Ipopt con otra huella: $huella" }
          Expand-Archive $zip -DestinationPath "$env:USERPROFILE\.convertersmartgrid\solvers\ipopt-3.14.20"
      - name: Frontend para las pruebas del backend
        working-directory: frontend
        run: npm ci
      - name: Suite sintética
        env:
          CSG_CI_SIN_GPU: '1'
        run: .venv\Scripts\python tools/puerta_calidad.py --ci

  frontend:
    name: Frontend (build y pruebas)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
