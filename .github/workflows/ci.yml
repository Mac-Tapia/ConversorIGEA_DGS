# Spec 102 (RF-12 a RF-15): en cada subida y petición de fusión, la suite sintética y el frontend.
# Aquí no hay datos de la distribuidora ni pueden subirse: sus pruebas se omiten, y la suite completa sin omitidas la
# exige el gancho pre-push en la máquina que los tiene (102:RF-5 a RF-9).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# 102:RF-26: el flujo solo lee el repositorio; ningún trabajo pide más.
permissions:
  contents: read

# 102:RF-29: la subida a una rama y su petición de fusión comparten grupo (head_ref en el PR, ref_name en la subida),
# así que la corrida nueva cancela la que sigue en marcha y un PR no corre dos veces.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Suite sintética (Windows, Python 3.12)
    runs-on: windows-latest
    # 102:RF-30 (17-11): la suite sintética ya tarda de 76 a 80 min en el runner; con 90 la corrida de main a05dad95 se
    # cortó al minuto 90 sin ningún fallo. El tope deja margen: al menos 1,5 veces lo medido.
    timeout-minutes: 180
    steps:
      # 102:RF-25: acciones fijadas por el SHA de su commit; 102:RF-27: sin credenciales en la copia.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Como en el equipo de desarrollo (102:RF-17): un .venv, porque el lanzador y sus pruebas corren dentro de uno
      # (pyvenv.cfg); el extra «ml» (torch de CPU aquí: no hay GPU), y las herramientas del frontend que usan dos
      # pruebas del backend (openapi-typescript, el lint de entrega). El 2026-11-10, sin ellos, 71 pruebas fallaban
      # solo en GitHub.
      - name: Dependencias
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip setuptools wheel
          .venv\Scripts\python -m pip install -r requirements.txt
          .venv\Scripts\python -m pip install -e ".[ml]"
      # 102:RF-28: errores de sintaxis y nombres sin definir, antes de la suite; ruff viene de requirements.txt.
      - name: Ruff
        run: .venv\Scripts\python -m ruff check --select E9,F63,F7,F82 .
      # 048 T3b: Ipopt oficial de COIN-OR, el mismo que en desarrollo, comprobado por su SHA-256 antes de usarlo.
      - name: Ipopt 3.14.20
        run: |
          $zip = "$env:RUNNER_TEMP\ipopt.zip"
          Invoke-WebRequest -Uri 'https://github.com/coin-or/Ipopt/releases/download/releases%2F3.14.20/Ipopt-3.14.20-win64-msvs2022-md.zip' -OutFile $zip
          $huella = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($huella -ne '1fd1de97d3e8e48c298f6ccf5ac91cbfc417b42c61262c08d193fd14117e9098') { throw "Ipopt con otra huella: $huella" }
          Expand-Archive $zip -DestinationPath "$env:USERPROFILE\.convertersmartgrid\solvers\ipopt-3.14.20"
      - name: Frontend para las pruebas del backend
        working-directory: frontend
        run: npm ci
      - name: Suite sintética
        env:
          CSG_CI_SIN_GPU: '1'
        run: .venv\Scripts\python tools/puerta_calidad.py --ci

  frontend:
    name: Frontend (build y pruebas)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
