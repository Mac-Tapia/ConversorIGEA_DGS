[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igea-dgs"
version = "2.1.0"
description = "Conversor universal IGEA/CYMDIST TXT → DIgSILENT PowerFactory DGS"
readme = "README.md"
# Python 3.12 exacto, y el límite superior es tan importante como el inferior.
#
# «powerfactory.pyd» de PowerFactory 2024 es una extensión binaria compilada contra
# CPython 3.12: no carga en 3.11 ni en 3.13, y falla con «DLL load failed», que no dice
# nada de la causa. Un «>=3.12» abierto deja instalar 3.14 y rompe la integración con
# PowerFactory, que es la razón de ser del proyecto; este repositorio tenía justamente
# un entorno en 3.14 que no podía hablar con DIgSILENT.
#
# Fijarlo aquí tiene una consecuencia que compensa el encorsetamiento: con el entorno
# en 3.12, el conversor importa «powerfactory» en su propio proceso y deja de hacer
# falta saltar a otro intérprete para cada llamada a la API.
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
geo = ["pyproj>=3.6"]
xlsx = ["pandas>=2.0", "openpyxl>=3.1"]
# Alternativa 2 de entrada: base de datos Access de CYMDIST (solo Windows)
access = ["pyodbc>=5.0"]
# Validación independiente del modelo (flujo de potencia sin PowerFactory)
validate = ["pandapower>=3.0"]
preview = ["geopandas>=0.14", "leafmap>=0.30", "pyproj>=3.6"]
# Interfaz web: API FastAPI que sirve el front React compilado (frontend/dist).
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
all = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pyproj>=3.6",
    "pyodbc>=5.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pandapower>=3.0",
    "geopandas>=0.14",
    "leafmap>=0.30",
]
dev = ["pytest>=8.0", "pyproj>=3.6", "httpx>=0.27"]

[project.scripts]
igea-dgs = "igea_dgs.cli:main"
igea-dgs-web = "igea_dgs.web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
igea_dgs = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "real_na203_na205: requiere artefactos reales regenerados; un skip no equivale a aceptación",
    "real_reference_inputs: requiere los TXT y MDB reales; un skip no equivale a aceptación",
    "real_load_batch: modifica y restaura cargas en proyectos PowerFactory dedicados",
]
