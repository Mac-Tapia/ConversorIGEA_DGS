[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igea-dgs"
version = "2.0.0"
description = "Conversor universal IGEA/CYMDIST TXT → DIgSILENT PowerFactory DGS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyproj>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
igea-dgs = "igea_dgs.cli:main"
igea-dgs-gui = "igea_dgs.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
igea_dgs = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
