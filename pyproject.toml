[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igea-dgs"
version = "2.1.0"
description = "Conversor universal IGEA/CYMDIST TXT → DIgSILENT PowerFactory DGS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "platformdirs>=4.2,<5",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
geo = ["pyproj>=3.6,<4"]
xlsx = ["pandas>=2.2,<3", "openpyxl>=3.1,<4"]
preview = ["geopandas>=1.0,<2", "leafmap>=0.38,<1", "pyproj>=3.6,<4", "shapely>=2.0,<3"]
all = [
    "pyproj>=3.6,<4",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "geopandas>=1.0,<2",
    "leafmap>=0.38,<1",
    "shapely>=2.0,<3",
]
dev = [
    "bandit>=1.7,<2",
    "hypothesis>=6.112,<7",
    "mypy>=1.11,<2",
    "pip-audit>=2.7,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[project.scripts]
igea-dgs = "igea_dgs.cli:main"
igea-dgs-gui = "igea_dgs.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
igea_dgs = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
