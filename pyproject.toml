[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convertersmartgrid"
dynamic = ["version"]
description = "Conversor universal CYMDIST TXT → DIgSILENT PowerFactory DGS"
readme = "README.md"
# Python 3.12 exacto, y el límite superior es tan importante como el inferior.
#
# «powerfactory.pyd» de PowerFactory 2024 es una extensión binaria compilada contra
# CPython 3.12: no carga en 3.11 ni en 3.13, y falla con «DLL load failed», que no dice
# nada de la causa. Un «>=3.12» abierto deja instalar 3.14 y rompe la integración con
# PowerFactory, que es la razón de ser del proyecto; este repositorio tenía justamente
# un entorno en 3.14 que no podía hablar con DIgSILENT.
#
# Fijarlo aquí tiene una consecuencia que compensa el encorsetamiento: con el entorno
# en 3.12, el conversor importa «powerfactory» en su propio proceso y deja de hacer
# falta saltar a otro intérprete para cada llamada a la API.
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
geo = ["pyproj>=3.6"]
xlsx = ["pandas>=2.0", "openpyxl>=3.1", "python-calamine>=0.3"]
# Informes en Word (spec 017)
informes = ["python-docx>=1.1", "pillow>=10.0"]
# Alternativa 2 de entrada: base de datos Access de CYMDIST (solo Windows)
access = ["pyodbc>=5.0"]
# Validación independiente del modelo (flujo de potencia sin PowerFactory)
validate = ["pandapower>=3.0"]
preview = ["geopandas>=0.14", "leafmap>=0.30", "pyproj>=3.6"]
# Interfaz web: API FastAPI que sirve el front React compilado (frontend/dist).
# Servidor MCP local de solo lectura (spec 077): tools/mcp_conversor.py. La web no lo necesita.
mcp = ["mcp>=2.3,<3"]
web = [
    "fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "psutil>=5.9",
    "pyproj>=3.6", "pandas>=2.0", "openpyxl>=3.1", "python-calamine>=0.3",
    "pypdf>=5.0", "python-docx>=1.1", "pillow>=10.0", "pandapower>=3.0",
    "requests>=2.31", "shapely>=2.0", "networkx>=3.0", "PyYAML>=6.0",
    "geopandas>=0.14", "pydantic>=2.0", "chardet>=5.0",
    "pyodbc>=5.0; sys_platform == 'win32'",
]
# Corpus PIDE: el lector PDF se importa al extraer documentos (036:RF-2).
pide = ["pypdf>=5.0"]
# Gemelo digital (spec 024, T11 y T12): la PINN/GNN y la GRU. Sin él, el oráculo radial y el
# temporal estacional cumplen el mismo contrato. Con GPU NVIDIA, instalar el de CUDA:
# pip install torch --index-url https://download.pytorch.org/whl/cu126
ml = [
    "torch>=2.4", "numpy>=1.26", "scipy>=1.11", "optuna>=4.0", "lightgbm==4.6.0", "pyarrow>=14", "psutil>=5.9",
    # Revisiones evaluadas de los adaptadores; el lock documental conserva hashes/licencias.
    "torch-geometric @ git+https://github.com/pyg-team/pytorch_geometric.git@ea2c5f62d54c8b414dd3ea7139814a7c1ef83182",
    "neuralforecast @ git+https://github.com/Nixtla/neuralforecast.git@cf7449383ac5ff6041ec35cbd97b84c23dd559a0",
    "pyomo @ git+https://github.com/Pyomo/pyomo.git@4a366e22ac69ab25f3c3620d0c465dae1499ff1c",
    "pymoo==0.6.2", "highspy==1.15.1",
    "sentence-transformers==5.7.0", "transformers==5.20.2", "peft==0.21.2",
    "bitsandbytes==0.50.2", "accelerate==1.15.0", "safetensors==0.8.0",
    "huggingface-hub==2.3.0", "sentencepiece==0.2.1",
]
all = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
    "pypdf>=5.0",
    "pyproj>=3.6",
    "pyodbc>=5.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-calamine>=0.3",
    "pandapower>=3.0",
    "geopandas>=0.14",
    "leafmap>=0.30",
    "requests>=2.31", "shapely>=2.0", "networkx>=3.0", "PyYAML>=6.0",
    "pydantic>=2.0", "chardet>=5.0",
    "python-docx>=1.1",
    "pillow>=10.0",
]
dev = ["pytest>=8.0", "pyproj>=3.6", "httpx2>=2.0", "reportlab>=5.1,<6", "ruff>=0.16.9,<0.17"]

[project.scripts]
convertersmartgrid = "convertersmartgrid.cli:main"
convertersmartgrid-web = "convertersmartgrid.web.__main__:main"
vnr-etl = "convertersmartgrid.adaptadores.entrada.vnr.cli:main"

# 002:RF-9: los propios van por la misma vía que un módulo externo.
[project.entry-points."convertersmartgrid.modulos"]
escritor-dgs = "convertersmartgrid.escritores:MODULO_DGS"
lector-mdb = "convertersmartgrid.sources.mdb:MODULO"
lector-txt = "convertersmartgrid.sources.txt:MODULO"
lector-vnr = "convertersmartgrid.sources.vnr:MODULO"

[tool.setuptools]
py-modules = ["vnr_etl"]

[tool.setuptools.packages.find]
where = ["src"]

# 086:RF-43: una sola versión, escrita en el paquete. setuptools la lee sin importarlo.
[tool.setuptools.dynamic]
version = {attr = "convertersmartgrid.__version__"}

[tool.setuptools.package-data]
# 086:RF-36: «_programa» solo existe en el árbol que prepara tools/construir_candidato.py; en desarrollo no hay nada.
convertersmartgrid = ["schemas/*.json", "recursos/leaflet/*", "recursos/*.md", "_programa/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# La evidencia se conserva fuera del checkout; pytest no deja cachés locales (065:RF-10).
addopts = "-p no:cacheprovider"
# 106:RF-5: una prueba que pasa de 30 min vuelca la pila de cada hilo (faulthandler) y sigue: la puerta del 2026-11-12
# estuvo 40 min parada sin decir dónde.
faulthandler_timeout = 1800
markers = ["gpu: la prueba usa la GPU; la marca la pone tests/conftest.py (106:RF-6)"]

# El código vive en src/: sin esto, los revisores del editor (mypy y pylint) marcaban
# «no se encuentra convertersmartgrid» en tools/ y tests/, aunque al ejecutar se encuentra
# siempre (paquete instalado en el .venv). Es el mismo dato que pythonpath de pytest.
[tool.mypy]
mypy_path = "src"

[tool.pylint.main]
source-roots = ["src"]

[tool.convertersmartgrid.capas]
deuda = "docs/implementacion065/deuda_arquitectura.json"

